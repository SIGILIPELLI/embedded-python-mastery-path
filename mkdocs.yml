site_name: Embedded Python Mastery Path
site_description: A structured, module-wise MicroPython training program from entry level to master level — free, ESP32-first (with Raspberry Pi Pico notes), every example runnable in the free Wokwi online simulator, no hardware required.
site_url: https://sigilipelli.github.io/embedded-python-mastery-path/
repo_url: https://github.com/SIGILIPELLI/embedded-python-mastery-path
repo_name: embedded-python-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · MicroPython vs. Python": level-1/01-micropython-vs-python.md
      - "02 · REPL & Workflow": level-1/02-repl-workflow.md
      - "03 · GPIO Basics": level-1/03-gpio-basics.md
      - "04 · PWM & ADC": level-1/04-pwm-adc.md
      - "05 · Timers & Interrupts": level-1/05-timers-interrupts.md
      - "06 · I2C & SPI Sensors": level-1/06-i2c-spi-sensors.md
      - "07 · Files & Persistence": level-1/07-files-persistence.md
      - "08 · WiFi & HTTP": level-1/08-wifi-http.md
      - "09 · uasyncio Basics": level-1/09-uasyncio-basics.md
      - "10 · Capstone — WiFi Sensor Logger": level-1/10-capstone-wifi-sensor-logger.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
